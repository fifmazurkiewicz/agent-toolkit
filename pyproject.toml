[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-toolkit"
version = "1.2.0"
description = "Small, vendored agent standards and skills for Cursor, Codex and Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
agent-toolkit = "agent_toolkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_toolkit = ["data/AGENT_STANDARD.md", "data/profiles/*.yaml", "data/skills/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
