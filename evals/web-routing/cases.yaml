should_trigger:
  - prompt: "Review my uncommitted code changes for bugs, security issues, and missing tests before merge."
    expected: [implementation-review]
  - prompt: "Zaprojektuj nowy panel klienta; najpierw ustalmy cel i zakres."
    expected: [brainstorming]
  - prompt: "Mamy zaakceptowany projekt przebudowy checkoutu. Rozpisz kroki wdrożenia i testy."
    expected: [writing-plans]
  - prompt: "Pokaż roadmapę produktu i aktywną zmianę jako aktualizowane tablice Kanban."
    expected: [planning-boards]
  - prompt: "Zmień nawigację, aby użytkownik mógł łatwo wrócić do koszyka po błędzie płatności."
    expected: [ux-ui-challenger]
  - prompt: "Zrób audyt klawiatury i czytnika ekranu dla formularza rejestracji."
    expected: [accessibility]
  - prompt: "Sprawdź endpoint logowania pod kątem walidacji i ujawniania sekretów."
    expected: [best-practices]
  - prompt: "Ten projekt nie ma jeszcze strategii testów. Ustal najważniejsze ryzyka i jak je testujemy."
    expected: [test-strategy]
  - prompt: "Napisz testy jednostkowe dla backend/app/patients/service.py na podstawie dokumentacji."
    expected: [behavioral-tests]
  - prompt: "Sprawdź testami mutacyjnymi, czy testy modułu płatności naprawdę łapią błędy."
    expected: [mutation-testing]
should_not_trigger:
  - prompt: "Popraw literówkę w zdaniu na stronie głównej."
    excluded: [brainstorming, writing-plans, ux-ui-challenger]
  - prompt: "Zmień odcień tła przycisku zgodnie z istniejącym tokenem koloru."
    excluded: [ux-ui-challenger, accessibility]
  - prompt: "Wyjaśnij, czym jest HTTP 404; nie zmieniaj kodu."
    excluded: [best-practices, writing-plans, planning-boards, implementation-review]
competition:
  - prompt: "Dodaj testy do istniejącego modułu płatności; kod już działa na produkcji."
    expected: [behavioral-tests]
    excluded: [tdd]
  - prompt: "Strategia testów jest gotowa. Dodaj test, który najpierw nie przechodzi, dla walidacji kwoty przelewu."
    expected: [tdd]
    excluded: [test-strategy]
  - prompt: "Chcę nową ścieżkę onboardingu. Nie znam jeszcze problemu użytkownika ani wymagań."
    expected: [brainstorming]
    excluded: [writing-plans]
  - prompt: "Projekt onboardingu jest zatwierdzony. Rozpisz sekwencję implementacji."
    expected: [writing-plans]
    excluded: [brainstorming]
  - prompt: "Mamy ustalony ekran; sprawdź, czy kolejność kroków i powrót po błędzie są zrozumiałe."
    expected: [ux-ui-challenger]
    excluded: [brainstorming, writing-plans]
